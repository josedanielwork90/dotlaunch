server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The app is a client-side router: every unknown path must return
    # index.html so a deep link such as /launchpad/lists/0x… works on a
    # hard refresh rather than 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable and safe to cache indefinitely.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # config.js is rewritten on every container start, so it must never be
    # cached — a stale copy would point the app at the wrong contracts.
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
